<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ezX Editor Code — Pro Live HTML/CSS/JS Editor</title>
<meta name="description" content="Editor kode HTML, CSS, dan JavaScript online dengan live preview, syntax highlighting, dan banyak fitur pro."/>

<!-- Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- CodeMirror 5 (syntax highlighting) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">

<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="header">
  <div class="header-left">
    <div class="logo">
      <div class="logo-icon"><i class="fa-solid fa-code"></i></div>
      <div class="logo-text">
        <span class="logo-title">ezX</span>
        <span class="logo-sub">Editor Code</span>
      </div>
    </div>

    <div class="status-dot" id="statusDot" title="Auto-save aktif"></div>
    <span class="status-text" id="statusText">Saved</span>
  </div>

  <div class="header-center">
    <div class="lib-picker">
      <i class="fa-solid fa-book"></i>
      <select id="libPicker">
        <option value="">+ Add Library CDN</option>
        <optgroup label="CSS Frameworks">
          <option value="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css|bootstrap">Bootstrap 5</option>
          <option value="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css|tailwind">Tailwind CSS</option>
          <option value="https://cdnjs.cloudflare.com/ajax/libs/bulma/0.9.4/css/bulma.min.css|bulma">Bulma</option>
          <option value="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css|animate">Animate.css</option>
        </optgroup>
        <optgroup label="JS Libraries">
          <option value="https://code.jquery.com/jquery-3.7.1.min.js|jquery">jQuery</option>
          <option value="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js|axios">Axios</option>
          <option value="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js|dayjs">Day.js</option>
          <option value="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js|gsap">GSAP</option>
          <option value="https://cdn.jsdelivr.net/npm/chart.js|chartjs">Chart.js</option>
          <option value="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js|threejs">Three.js</option>
          <option value="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js|moment">Moment.js</option>
        </optgroup>
        <optgroup label="Fonts">
          <option value="https://fonts.googleapis.com/css2?family=Roboto&display=swap|roboto">Roboto Font</option>
          <option value="https://fonts.googleapis.com/css2?family=Poppins&display=swap|poppins">Poppins Font</option>
        </optgroup>
      </select>
    </div>

    <div class="active-libs" id="activeLibs"></div>
  </div>

  <div class="header-right">
    <button class="btn-icon" id="themeBtn" title="Toggle Theme">
      <i class="fa-solid fa-moon"></i>
    </button>
    <button class="btn-icon" id="layoutBtn" title="Toggle Layout">
      <i class="fa-solid fa-table-columns"></i>
    </button>
    <button class="btn-icon" id="fullscreenBtn" title="Fullscreen">
      <i class="fa-solid fa-expand"></i>
    </button>
    <button class="btn btn-secondary" id="shareBtn" title="Share URL">
      <i class="fa-solid fa-share-nodes"></i> Share
    </button>
    <button class="btn btn-secondary" id="downloadBtn" title="Download HTML">
      <i class="fa-solid fa-download"></i> Download
    </button>
    <button class="btn btn-secondary" id="resetBtn" title="Reset kode">
      <i class="fa-solid fa-rotate-left"></i> Reset
    </button>
    <button class="btn btn-primary" id="runBtn" title="Run (Ctrl+S)">
      <i class="fa-solid fa-play"></i> Run
    </button>
  </div>
</header>

<!-- ============ MAIN ============ -->
<main class="main" id="main">
  <!-- Editor Side -->
  <section class="editor-side" id="editorSide">
    <div class="tabs">
      <button class="tab active" data-tab="html">
        <i class="fa-brands fa-html5"></i> HTML
      </button>
      <button class="tab" data-tab="css">
        <i class="fa-brands fa-css3-alt"></i> CSS
      </button>
      <button class="tab" data-tab="js">
        <i class="fa-brands fa-js"></i> JS
      </button>
      <div class="tabs-spacer"></div>
      <button class="tab-mini" id="formatBtn" title="Format code">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </button>
      <button class="tab-mini" id="clearBtn" title="Clear current tab">
        <i class="fa-solid fa-eraser"></i>
      </button>
      <button class="tab-mini" id="wrapBtn" title="Toggle word wrap">
        <i class="fa-solid fa-text-width"></i>
      </button>
    </div>

    <div class="editors">
      <div class="editor-wrap active" data-editor="html">
        <textarea id="html"></textarea>
      </div>
      <div class="editor-wrap" data-editor="css">
        <textarea id="css"></textarea>
      </div>
      <div class="editor-wrap" data-editor="js">
        <textarea id="js"></textarea>
      </div>
    </div>
  </section>

  <!-- Resizer -->
  <div class="resizer" id="resizer"></div>

  <!-- Preview Side -->
  <section class="preview-side" id="previewSide">
    <div class="preview-tabs">
      <button class="ptab active" data-view="preview">
        <i class="fa-solid fa-eye"></i> Preview
      </button>
      <button class="ptab" data-view="console">
        <i class="fa-solid fa-terminal"></i> Console
        <span class="badge" id="consoleBadge">0</span>
      </button>
      <div class="tabs-spacer"></div>
      <button class="tab-mini" id="refreshBtn" title="Refresh">
        <i class="fa-solid fa-rotate"></i>
      </button>
      <button class="tab-mini" id="popoutBtn" title="Open preview in new tab">
        <i class="fa-solid fa-up-right-from-square"></i>
      </button>
    </div>

    <div class="preview-body">
      <iframe id="preview" class="view active" sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin"></iframe>
      <div id="console" class="view">
        <div class="console-toolbar">
          <button class="tab-mini" id="clearConsoleBtn" title="Clear console">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
        <div class="console-output" id="consoleOutput"></div>
      </div>
    </div>
  </section>
</main>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast"></div>

<!-- ============ SHARE MODAL ============ -->
<div class="modal" id="shareModal">
  <div class="modal-content">
    <h3><i class="fa-solid fa-share-nodes"></i> Share Your Code</h3>
    <p>Bagikan link ini agar orang lain bisa melihat dan menjalankan kodemu:</p>
    <div class="share-input">
      <input type="text" id="shareUrl" readonly>
      <button class="btn btn-primary" id="copyShareBtn">
        <i class="fa-solid fa-copy"></i> Copy
      </button>
    </div>
    <p class="modal-note"><i class="fa-solid fa-info-circle"></i> Kode disimpan di URL (maks ~8KB). Untuk proyek besar gunakan Download.</p>
    <button class="modal-close" id="closeShareBtn"><i class="fa-solid fa-times"></i></button>
  </div>
</div>

<!-- ============ CodeMirror libs ============ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchtags.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldgutter.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/brace-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/indent-fold.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/comment/comment.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/jump-to-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/xml-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/html-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/css-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/javascript-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/keymap/sublime.min.js"></script>

<script src="script.js"></script>
</body>
</html>
